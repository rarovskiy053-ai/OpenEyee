--g1:linear-gradient(120deg,#7a2433,#7a5220,#7a2433);
--g2:linear-gradient(120deg,#1f3a8a,#4a2a8a,#1f3a8a);
--g3:linear-gradient(120deg,#1f6b3a,#56701c,#1f6b3a);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
html,body{margin:0;color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:14px 14px 0;max-width:520px;margin:0 auto;isolation:isolate}
.bg{position:fixed;inset:0;z-index:-2;background:#000 var(--logo) 50% 32%/min(135vw,95vh) no-repeat;filter:blur(13px) brightness(.62)}
.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(#0009,#0003 35%,#0006 70%,#000c)}
h1,h2{font-family:Unbounded,Manrope,sans-serif;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:19px;margin:6px 0 4px}
p{margin:0 0 12px;color:var(--mut)}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none;text-align:left}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
#app{flex:1}
.hero{text-align:center;padding:4px 0 18px}
.hero h1{font-size:25px;margin-top:8px;text-shadow:0 2px 14px #000}
.hero p{margin:6px 0 0;color:#d0d0d0}
.eye{width:250px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 16px rgba(255,255,255,.25))}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.07)}}
#iris,#tp{transition:transform .14s ease-out}
.back{color:var(--mut);padding:6px 2px 10px;font-weight:600;text-shadow:0 1px 8px #000}

/* чёрные кнопки с разноцветным контуром */
.row,.chip,.btn,.ref,.pager button,.cardnum{border:2px solid transparent;color:#fff;
 background-image:linear-gradient(#000,#000),linear-gradient(120deg,#D2B4B4 0%,#927575 38%,#5C4242 70%,#632F2D 100%);
 background-origin:padding-box,border-box;background-clip:padding-box,border-box;background-size:100% 100%;
 animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes flow{to{background-position:0 0,100% 0}}
.row:nth-child(5n+1),.chip:nth-child(5n+1){--g:var(--g1)}
.row:nth-child(5n+2),.chip:nth-child(5n+2){--g:var(--g2)}
.row:nth-child(5n+3),.chip:nth-child(5n+3){--g:var(--g3)}
.row:nth-child(5n+4),.chip:nth-child(5n+4){--g:var(--g4)}
.row:nth-child(5n+5),.chip:nth-child(5n+5){--g:var(--g5)}
.list{display:flex;flex-direction:column;gap:9px;margin-bottom:9px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:16px;transition:transform .12s}
.row:active,.chip:active,.btn:active{transform:scale(.97)}
.row .ic{font-size:22px;width:42px;height:42px;display:grid;place-items:center;background:#161616;border-radius:12px;flex:none}
.row b{display:block;font-weight:800}
.row small{color:var(--mut);font-size:12.5px}
.row .go{white-space:nowrap;margin-left:auto;color:#fff;font-size:20px}
.row.big{padding:18px 14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.pair .row{padding:12px}
.ref{--g:var(--g1);width:100%;padding:16px;border-radius:16px}
.ref small{display:block;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.chip{padding:14px 10px;border-radius:14px;font-weight:600;text-align:center}
.chip .fl{font-size:20px;margin-right:6px}
.pager{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.pager button{padding:10px 20px;border-radius:12px;text-align:center}
.pager span{color:#d0d0d0;text-shadow:0 1px 6px #000}
.btn{display:block;width:100%;padding:14px;border-radius:14px;text-align:center;font-weight:800;margin-top:9px}
.btn.ok{--g:var(--g3)}.btn.bad{--g:var(--g4)}.btn.ghost{--g:var(--g5)}
input{width:100%;padding:14px;border-radius:14px;background:#000;border:1px solid #444;margin-top:6px}
input:focus{outline:none;border-color:#fff}
.card{background:rgba(0,0,0,.8);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;backdrop-filter:blur(4px)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span{color:var(--mut)}
.kv b{text-align:right;word-break:break-all}
.num{font-family:Unbounded,Manrope,sans-serif;font-size:26px;font-weight:700}
.bar{height:10px;background:#222;border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#D2B4B4,#927575,#5C4242,#632F2D);border-radius:9px;transition:width .4s}
.cardnum{font-family:Unbounded,monospace;font-size:19px;letter-spacing:.04em;color:#fff;padding:14px;border-radius:14px;width:100%;text-align:center}
.prize{display:flex;gap:10px;padding:6px 0}
.done{text-align:center;padding:40px 8px}
.done .big{font-size:54px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:#000;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.notice{background:rgba(0,0,0,.82);border:1px solid #5C4242;border-left:4px solid #D2B4B4;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:13.5px;line-height:1.5;color:#e6dcdc;animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.err{color:var(--bad);min-height:20px;font-size:13px;margin:6px 0 0}

/* заставка и появление */
#splash{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .8s ease,transform .8s ease}
#splash.out{opacity:0;transform:scale(1.07);pointer-events:none}
.sp-logo{width:210px;height:210px;border-radius:50%;background:var(--logo) center/cover;box-shadow:0 0 60px rgba(255,255,255,.18);animation:pulse 2.4s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 95px rgba(255,255,255,.34);transform:scale(1.025)}}
#speye{width:120px;filter:drop-shadow(0 0 10px rgba(255,255,255,.25))}
#spiris,#sppu{transition:transform .12s ease-out}
.sp-bar{width:230px;height:6px;border-radius:6px;background:#1c1c1c;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#D2B4B4,#927575,#5C4242,#632F2D);border-radius:6px}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hero,h2,.card,.pager,.back{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}

/* щупальца с глазами как на логотипе */
.tent{margin:10px -14px 0;line-height:0;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(transparent,#000 24%);mask-image:linear-gradient(transparent,#000 24%)}
.tent svg{width:100%;height:auto;display:block}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sw var(--d) ease-in-out infinite alternate;animation-delay:var(--o)}
.fl{transform-box:fill-box;transform-origin:50% 0;animation:fl var(--d2) ease-in-out infinite alternate;animation-delay:var(--o)}
@keyframes sw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes fl{from{transform:skewX(-6deg) scaleY(.97)}to{transform:skewX(5deg) scaleY(1.03)}}
.eb{transform-box:fill-box;transform-origin:center;animation:eblink 6s infinite;animation-delay:var(--o)}
@keyframes eblink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
.pp{animation:peek var(--p,6s) ease-in-out infinite;animation-delay:var(--o)}
@keyframes peek{0%,100%{transform:translate(0,0)}25%{transform:translate(5px,-1.5px)}50%{transform:translate(-5px,1.5px)}75%{transform:translate(2px,2.5px)}}
.bob{animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* Щупальца как на логотипе: острые белые лезвия, качаются сами, как на ветру */
(function(){
  const bez=(p,t)=>{const u=1-t,k=[u*u*u,3*u*u*t,3*u*t*t,t*t*t];return [0,1].map(j=>k[0]*p[0][j]+k[1]*p[1][j]+k[2]*p[2][j]+k[3]*p[3][j])};
  const f=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);
  function blade(x0,w,L,a){
    const P=[[x0,-10],[x0+a*1.2,L*.3],[x0-a*1.4,L*.65],[x0+(210-x0)*.2,L]],l=[],r=[],N=22;
    for(let i=0;i<=N;i++){const t=i/N,c=bez(P,t),c2=bez(P,Math.min(1,t+.01)),c1=bez(P,Math.max(0,t-.01));
      let nx=-(c2[1]-c1[1]),ny=c2[0]-c1[0];const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
      const hw=w/2*Math.pow(1-t,.8)*(1+.18*Math.sin(t*6));
      l.push([c[0]+nx*hw*1.1,c[1]+ny*hw*1.1]);r.push([c[0]-nx*hw*.8,c[1]-ny*hw*.8]);}
    return {d:'M'+l.map(f).join('L')+'L'+r.reverse().map(f).join('L')+'Z',P,w};
  }
  const EY=(x,y,s,rot,o,p)=>`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)}) scale(${s})"><g class="eb" style="--o:${o}s"><path d="M-20 0C-10-13 10-13 20 0 10 13-10 13-20 0Z" fill="#f2f2f2" stroke="#000" stroke-width="2.5"/><circle class="pp" style="--o:${o}s;--p:${p}s" r="6.5" fill="#000"/></g></g>`;
  const B=[[14,30,150,10],[60,36,185,-14],[108,38,205,12],[158,40,215,-10],[208,40,222,8],[258,40,212,-12],[308,38,200,12],[356,36,182,-14],[402,30,150,10]];
  let g='';
  B.forEach(([x0,w,L,a],i)=>{
    const bl=blade(x0,w,L,a);
    let eyes='';
    if(i%2==1||i==4){const t=.5+(i%3)*.08,c=bez(bl.P,t),c2=bez(bl.P,t+.02),ang=Math.atan2(c2[1]-c[1],c2[0]-c[0])*180/Math.PI,side=i%4==1?1:-1,off=(w/2*Math.pow(1-t,.8)+15)*side;
      eyes=EY(c[0]+off,c[1],1.15,ang*.7*side,(i*.7).toFixed(1),(5+i*.6).toFixed(1))}
    g+=`<g class="sw" style="--d:${(3.4+(i*1.3)%3).toFixed(1)}s;--o:-${(i*.8).toFixed(1)}s"><g class="fl" style="--d2:${(2.2+(i*.9)%2.4).toFixed(1)}s"><path d="${bl.d}" fill="#f2f2f2"/>${eyes}</g></g>`;
  });
  g+=`<g class="bob">${EY(210,252,1.8,-3,0,7)+EY(262,236,1.1,10,1.3,5.5)+EY(160,236,.9,-10,.6,6.5)+EY(118,254,.8,0,2.2,5)+EY(306,250,1,-32,1.8,6)+EY(220,226,.65,6,2.9,4.5)}</g>`;
  $('#tent').innerHTML=`<svg viewBox="0 0 420 275" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${g}</svg>`;
})();

/* Верхний глаз следит за пальцем */
function look(cx,cy){
  const t=$('#topeye'); if(!t) return;
  const r=t.getBoundingClientRect();let dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);
  const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/150);dx=dx/d*k;dy=dy/d*k;
  $('#iris').style.transform=`translate(${dx*8}px,${dy*5}px)`;
  $('#tp').style.transform=`translate(${dx*30}px,${dy*30}px)`;
}
addEventListener('pointermove',e=>look(e.clientX,e.clientY));
addEventListener('pointerdown',e=>look(e.clientX,e.clientY));

/* Заставка: логотип, глаз следит за полоской загрузки, затем меню выплывает из темноты */
(function(){
  const sp=$('#splash'),fill=$('#spfill'),bar=fill.parentElement;let p=0,ready=false,done=false;
  const loaded=document.readyState==='complete'?Promise.resolve():new Promise(r=>addEventListener('load',r,{once:true}));
  const fonts=Promise.race([document.fonts?document.fonts.ready:0,new Promise(r=>setTimeout(r,2500))]);
  Promise.all([loaded,fonts,new Promise(r=>setTimeout(r,1800))]).then(()=>ready=true);
  setTimeout(()=>ready=true,5000);
  function tick(){
    p+=((ready?1:.88)-p)*.05; if(ready&&p>.995)p=1;
    fill.style.width=(p*100)+'%';
    const b=bar.getBoundingClientRect(),e=$('#speye').getBoundingClientRect();
    let dx=b.left+b.width*p-(e.left+e.width/2),dy=b.top-(e.top+e.height/2);
    const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/110);dx=dx/d*k;dy=dy/d*k;
    $('#spiris').style.transform=`translate(${dx*8}px,${dy*5}px)`;
    $('#sppu').style.transform=`translate(${dx*30}px,${dy*30}px)`;
    if(p>=1&&!done){done=true;setTimeout(()=>{sp.classList.add('out');render();setTimeout(()=>sp.remove(),900)},350);return}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(()=>{if(!$('#app').children.length){sp.remove();render()}},9000);  // страховка
})();
</script>
</body>
</html>
